# Render blueprint: deploys the website + API and a PostgreSQL database in one click
# (Render dashboard -> New -> Blueprint -> pick this GitHub repository).
# After the first deploy, open the web service's Shell and run: npm run db:setup
databases:
  - name: foodies-db
    plan: free
    databaseName: foodies

services:
  - type: web
    name: foodies
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: foodies-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true          # Render makes a long random secret
      - key: OPENAI_API_KEY
        sync: false                  # typed by hand in the dashboard, never in git
      - key: OPENAI_MODEL
        sync: false
      - key: CHAT_DAILY_LIMIT
        value: "300"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
